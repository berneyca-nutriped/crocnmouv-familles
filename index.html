<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#CDDF70">
<link rel="manifest" href="manifest.webmanifest">

<style>
/* Layout: app mobile d'abord, cartes arrondies vert pâle comme crocnmouv.ch, barre d'onglets en bas */
:root{
  --bg:#ffffff; --surface:#F0F2BC; --surface-2:#F7F8DE; --lime:#CDDF70; --lime-strong:#B7CC4A;
  --ink:#1B1D12; --muted:#5E6248; --line:#E2E5B8; --on-lime:#1B1D12;
  --ok:#2F7D3A; --ok-bg:#DDF0D9; --warn:#8A5A00; --warn-bg:#FBEACB; --bad:#A3271F; --bad-bg:#F9DAD6; --info-bg:#E6E9F7; --info:#33408A;
  --font:'Poppins',system-ui,-apple-system,"Segoe UI",sans-serif; --hand:'Caveat Brush','Poppins',cursive;
  --r:22px; --r-sm:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13140D; --surface:#262A16; --surface-2:#1D2011; --lime:#CDDF70; --lime-strong:#D8E88A;
  --ink:#F1F3DC; --muted:#AEB291; --line:#353A20; --on-lime:#1B1D12;
  --ok:#8BD594; --ok-bg:#1E3A22; --warn:#F2C26B; --warn-bg:#3D2E10; --bad:#F59A90; --bad-bg:#45201B; --info-bg:#232A4A; --info:#AFBAF5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13140D; --surface:#262A16; --surface-2:#1D2011; --lime:#CDDF70; --lime-strong:#D8E88A;
  --ink:#F1F3DC; --muted:#AEB291; --line:#353A20; --on-lime:#1B1D12;
  --ok:#8BD594; --ok-bg:#1E3A22; --warn:#F2C26B; --warn-bg:#3D2E10; --bad:#F59A90; --bad-bg:#45201B; --info-bg:#232A4A; --info:#AFBAF5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;font-weight:600}
h1{font-size:1.7rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lime-strong);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo-img{display:block;height:46px;width:auto}
.logo-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-black{filter:invert(1)}}
:root[data-theme="dark"] .logo-black{filter:invert(1)}

/* ---------- Connexion ---------- */
#login{min-height:100%;display:grid;place-items:center;padding-block:32px}
.login-card{width:100%;max-width:440px;display:grid;gap:22px}
.login-hero{background:var(--lime);border-radius:var(--r) var(--r) var(--r) 0;padding:28px 24px 0;position:relative;color:var(--on-lime)}
.login-hero h1{font-size:1.6rem;max-width:14ch}
.login-hero p{margin-top:6px;font-size:.95rem}
.login-hero .badge-logo{display:block;width:170px;margin:10px 0 -24px auto;background:var(--bg);border-radius:var(--r) 0 0 0;padding:10px 6px 0 12px}
.form{display:grid;gap:14px}
label.f{display:grid;gap:6px;font-weight:500;font-size:.9rem}
.input,select.input,textarea.input{width:100%;border:2px solid var(--line);background:var(--surface-2);border-radius:var(--r-sm);padding:12px 14px;min-height:48px}
textarea.input{min-height:90px;resize:vertical}
.input:focus{border-color:var(--lime-strong);outline:none}
.btn{border:0;border-radius:999px;padding:13px 24px;font-weight:600;background:var(--surface);color:var(--ink);min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--lime);color:var(--on-lime)}
.btn.primary:hover{background:var(--lime-strong)}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.small{padding:8px 16px;min-height:38px;font-size:.88rem}
.hint{font-size:.85rem;color:var(--muted)}
.demo-box{background:var(--surface-2);border:2px dashed var(--line);border-radius:var(--r-sm);padding:14px;display:grid;gap:10px;font-size:.88rem}
.demo-box .row{display:flex;flex-wrap:wrap;gap:8px}
.err{color:var(--bad);font-size:.88rem;font-weight:500}

/* ---------- Coque app ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.topbar .who{margin-left:auto;text-align:right;font-size:.85rem;line-height:1.3;min-width:0}
.topbar .who b{display:block;font-size:.95rem}
.iconbtn{border:0;background:var(--surface);border-radius:999px;width:42px;height:42px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
main{flex:1;padding-block:20px 110px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding-block:6px}
.tab{border:0;background:transparent;border-radius:16px;padding:8px 4px;display:grid;justify-items:center;gap:2px;font-size:.75rem;font-weight:500;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.section{display:grid;gap:18px}
.section-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.hand{font-family:var(--hand);font-weight:400;font-size:1.5rem;letter-spacing:.01em}
.card{background:var(--surface);border-radius:var(--r);padding:20px}
.card.plain{background:var(--surface-2)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:.76rem;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip svg{width:13px;height:13px}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.info{background:var(--info-bg);color:var(--info)}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.seg button{flex:none;border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 14px;font-weight:500;font-size:.88rem;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}

/* ---------- Parent ---------- */
.kid-hero{background:var(--lime);color:var(--on-lime);border-radius:var(--r) var(--r) var(--r) 0;padding:22px;display:grid;gap:12px}
.kid-hero .chips .chip{background:rgba(255,255,255,.55);color:var(--on-lime)}
.kid-hero .chips .chip.bad{background:var(--bad-bg);color:var(--bad)}
.progress{height:10px;border-radius:999px;background:rgba(255,255,255,.5);overflow:hidden}
.progress i{display:block;height:100%;background:var(--on-lime);border-radius:999px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:12px}
legend{font-weight:600;font-size:1.05rem;margin-bottom:4px;padding:0}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.9rem;cursor:pointer}
.checks input{accent-color:var(--lime-strong);width:18px;height:18px}
.checks label:has(input:checked){border-color:var(--lime-strong);background:var(--surface-2)}
.med-row{display:grid;grid-template-columns:2fr 1fr 1.4fr auto;gap:8px;align-items:center}
@media (max-width:560px){.med-row{grid-template-columns:1fr 1fr}.med-row .input:first-child{grid-column:1/-1}}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.pillar{background:var(--surface);border-radius:var(--r);padding:20px}
.pillar h3{font-size:1.25rem;margin-bottom:10px}
.pillar ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.pillar li::before{content:"- "}
.days{display:grid;gap:8px}
.day{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:baseline;padding:12px 16px;background:var(--surface-2);border-radius:var(--r-sm)}
.day b{font-size:.85rem;text-transform:uppercase;letter-spacing:.06em}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ph{position:relative;aspect-ratio:1;border-radius:var(--r-sm);overflow:hidden;max-width:100%;background:var(--surface);display:grid;place-items:center;color:var(--on-lime);border:0;padding:0}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .cap{position:absolute;left:6px;right:6px;bottom:6px;font-size:.72rem;font-weight:600;background:rgba(255,255,255,.8);color:#1B1D12;border-radius:8px;padding:2px 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .type{position:absolute;top:6px;right:6px;background:rgba(27,29,18,.75);color:#fff;border-radius:999px;padding:2px 8px;font-size:.7rem;display:flex;gap:4px;align-items:center}
.ph .type svg{width:12px;height:12px}
.ph .sel{position:absolute;top:6px;left:6px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.85);border:2px solid #1B1D12;display:grid;place-items:center}
.ph[aria-pressed="true"] .sel{background:var(--lime);}
.ph[aria-pressed="true"]{outline:3px solid var(--lime-strong);outline-offset:-3px}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.recipe{background:var(--surface);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;border:0;padding:0;text-align:left}
.recipe .art{aspect-ratio:16/10;max-width:100%;width:100%;display:grid;place-items:center;overflow:hidden}
.recipe .art img{width:100%;height:100%;object-fit:cover}
.recipe .body{padding:16px 18px 18px;display:grid;gap:8px}
.recipe .meta{font-size:.82rem;color:var(--muted)}
.recipe-detail ol,.recipe-detail ul{margin:0;padding-left:1.2em;display:grid;gap:6px}

/* ---------- Admin ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:var(--r-sm);padding:12px 14px;border:0;text-align:left;display:grid;gap:2px}
.stat .n{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:.8rem;color:var(--muted);font-weight:500}
.stat.alert .n{color:var(--bad)}
.stat[aria-pressed="true"]{outline:3px solid var(--lime-strong)}
.group{display:grid;gap:8px}
.group-head{display:flex;align-items:baseline;gap:10px;padding:6px 2px}
.group-head h3{font-size:1.1rem}
.group-head span{color:var(--muted);font-size:.85rem}
.kid-row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;border:0;text-align:left;width:100%}
.kid-row:hover{background:var(--surface)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.kid-row .name{font-weight:600;min-width:0}
.kid-row .name small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.kid-row .chips{grid-column:2/-1}
.pay-dot{font-size:.76rem;font-weight:700;padding:4px 10px;border-radius:999px}
.table-wrap{overflow-x:auto;border-radius:var(--r-sm);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.85rem;min-width:720px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0}
td.num{font-variant-numeric:tabular-nums}
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,5,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:16px}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:24px;max-height:88%}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:.92rem}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{margin:0;min-width:0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface-2);border-radius:var(--r-sm);padding:12px 14px}
.switch{position:relative;width:52px;height:30px;border-radius:999px;border:0;background:var(--line);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{left:25px}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:var(--r-sm);padding:12px 14px;font-size:.88rem;font-weight:500}
.upload{border:2px dashed var(--lime-strong);border-radius:var(--r-sm);padding:16px;display:grid;justify-items:center;gap:6px;text-align:center;cursor:pointer;background:var(--surface-2)}
.upload input{position:absolute;opacity:0;width:1px;height:1px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 200px}
/* ---------- Impression ---------- */
.print-opts{display:grid;gap:14px}
.paper{background:#fff;color:#111;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.15);padding:24px;display:grid;gap:14px;overflow-x:auto}
.paper-head{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.paper-head img{height:52px}
.paper h2{font-size:1.15rem;color:#111}
.paper .sub{font-size:.8rem;color:#555}
.paper h3{font-size:.95rem;color:#111;border-bottom:2px solid #CDDF70;padding-bottom:4px}
.paper table{min-width:0;font-size:.78rem;color:#111}
.paper th{background:#F0F2BC;color:#111;position:static}
.paper td,.paper th{border:1px solid #ddd;padding:6px 7px}
.paper .tick{display:inline-block;width:14px;height:14px;border:1.5px solid #333;border-radius:3px}
.paper .alert{color:#A3271F;font-weight:700}
@media print{
  body *{visibility:hidden}
  .paper,.paper *{visibility:visible}
  .paper{position:absolute;left:0;top:0;width:100%;box-shadow:none;border-radius:0;padding:0}
  @page{size:A4 landscape;margin:12mm}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>

/* ---------------- Statut d'un enfant (chips) ---------------- */
function statusChips(k,{withPay=true}={}){
 const c=[];
 if(withPay)c.push(k.paid?'<span class="chip ok">Payé</span>':'<span class="chip bad">Non payé</span>');
 if(!k.done)c.push('<span class="chip warn">Fiche à compléter</span>');
 if(k.allergies)c.push(`<span class="chip ${k.severe?"bad":"warn"}">${I.warn}${esc(k.allergies)}</span>`);
 if(k.meds.length)c.push(`<span class="chip info">${I.pill}${k.meds.length>1?k.meds.length+" médicaments":"Médicament"}</span>`);
 if(k.patho)c.push(`<span class="chip info">${esc(k.patho)}</span>`);
 k.diet.forEach(d=>c.push(`<span class="chip">${esc(d)}</span>`));
 c.push(k.photos?'<span class="chip ok">Photos OK</span>':`<span class="chip bad">${I.nocam}Pas de photos</span>`);
 if(k.seul)c.push('<span class="chip info">Rentre seul</span>');
 if(k.obs)c.push('<span class="chip">Observation</span>');
 return c.join("");
}

function completion(k){
 let n=0;const t=6;

let pendingImg="";
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-act],[data-ptab],[data-atab],[data-pweek],[data-aweek],[data-mweek],[data-filter],[data-amode],[data-kid],[data-recipe],[data-msel],[data-prweek]");
 if(!t)return;
 const d=t.dataset;
 if(d.act==="closeSheet"){if(t.classList.contains("sheet-bg")&&e.target!==t)return;S.sheet=null;return render()}
 if(d.act==="demoParent"){S.me=kids[0];S.view="parent";S.ptab="enfant";return render()}
 if(d.act==="demoAdmin"){S.view="admin";return render()}
 if(d.act==="logout"){S.view="login";S.me=null;S.sheet=null;return render()}
 if(d.ptab){S.ptab=d.ptab;scrollTo(0,0);return render()}
 if(d.atab){S.atab=d.atab;scrollTo(0,0);return render()}
 if(d.pweek){S.pweek=+d.pweek;return render()}
 if(d.aweek!==undefined){S.aweek=+d.aweek||null;return render()}
 if(d.mweek){S.mweek=+d.mweek;S.msel.clear();return render()}
 if(d.filter){S.afilter=S.afilter===d.filter&&d.filter!=="tous"?"tous":d.filter;return render()}
 if(d.amode){S.amode=d.amode;return render()}
 if(d.kid){S.sheet=kidSheet(+d.kid);return render()}
 if(d.recipe){S.sheet=recipeSheet(recipes.find(r=>r.id===+d.recipe));return render()}
 if(d.msel){S.msel.has(d.msel)?S.msel.delete(d.msel):S.msel.add(d.msel);return render()}
 if(d.act==="togglePaid"){const k=kids.find(x=>x.id===+d.id);k.paid=!k.paid;render();return toast(k.paid?`${kidName(k)} : paiement reçu`:`${kidName(k)} : marqué non payé`)}
 if(d.act==="saveObs"){const k=kids.find(x=>x.id===+d.id);k.obs=$("#aObs").value.trim();S.sheet=null;render();return toast("Observation enregistrée")}
 if(d.act==="addMed"){const box=$("#meds");box.insertAdjacentHTML("beforeend",medRow({name:"",dose:"",when:""},box.children.length));return}
 if(d.act==="delMed"){t.parentElement.remove();return}
 if(d.act==="clearSel"){S.msel.clear();return render()}
 if(d.act==="dlAll"){return toast(`Dans l'app finale : un fichier .zip avec les ${(media[S.mweek]||[]).length} fichiers de la semaine ${S.mweek} se télécharge.`)}
 if(d.act==="dlSel"){return toast(`Dans l'app finale : un fichier .zip avec les ${S.msel.size} fichiers choisis se télécharge.`)}
 if(d.prweek){S.prweek=+d.prweek;return render()}
 if(d.act==="doPrint"){try{window.print()}catch(_){}return toast("Dans l'app finale, la fenêtre d'impression s'ouvre avec cette page (bloquée dans la maquette).")}
 if(d.act==="copyPrint"){const {list,cols}=printData();const rows=[["Enfant",...cols.filter(c=>c[2]).map(c=>c[1])].join("\t"),...list.map(k=>[kidName(k),...cols.filter(c=>c[2]).map(c=>c[2](k))].join("\t"))].join("\n");
  navigator.clipboard?.writeText(rows).then(()=>toast("Tableau copié, collez-le dans Excel ou Word"),()=>toast("Copie impossible dans cet affichage"));return}
 if(d.act==="newRecipe"){pendingImg="";S.sheet=recipeForm;return render()}
});

  files.forEach(f=>{const isV=f.type.startsWith("video");
   const add=src=>{media[S.mweek]=media[S.mweek]||[];media[S.mweek].unshift({id:"u"+Date.now()+Math.random(),type:isV?"video":"photo",cap:f.name.replace(/\.[^.]+$/,""),hue:"#CDDF70",src});if(--left===0){render();toast(files.length+" fichier"+(files.length>1?"s":"")+" ajouté"+(files.length>1?"s":""))}};
   if(isV)return add("");const rd=new FileReader();rd.onload=()=>add(rd.result);rd.readAsDataURL(f)});
 }
 if(e.target.id==="rImg"){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{pendingImg=rd.result;$("#rImgLbl").textContent="Photo ajoutée : "+f.name};rd.readAsDataURL(f)}
});
document.addEventListener("submit",e=>{
 e.preventDefault();
 if(e.target.id==="loginForm"){
  const o=$("#lgOrder").value.replace(/[#\s]/g,"").replace(/^0+/,""),k=kids.find(x=>x.order===o);
  if(!k){const er=$("#lgErr");er.textContent="Ce numéro de commande est introuvable. Vérifiez l'e-mail de confirmation (numéro de commande Squarespace, par ex. 14817).";er.hidden=false;return}
  S.me=k;S.view="parent";S.ptab="enfant";return render();
 }
 if(e.target.id==="kidForm"){
  const k=S.me;
  if(!$("#fCgv").checked){const er=$("#kErr");er.hidden=false;er.scrollIntoView({block:"center"});return}
  k.cgv=true;k.parent=$("#fParent").value.trim()||k.parent;k.email=$("#fEmail").value.trim();k.adresse=$("#fAdr").value.trim();k.parent2=$("#fP2").value.trim();
  k.seul=$("#fSeulY").checked;k.pickup=$("#fPick").value.trim();k.assMaladie=$("#fAM").value.trim();k.assAccident=$("#fAA").value.trim();k.rc=$("#fRC").value.trim();
  k.prenom=$("#fPrenom").value.trim()||k.prenom;k.nom=$("#fNom").value.trim()||k.nom;k.naissance=$("#fNaiss").value||k.naissance;
  k.tel=$("#fTel").value.trim();k.urgence=$("#fUrg").value.trim();
  k.diet=DIETS.filter((d,i)=>$("#fd"+i).checked);k.allergies=$("#fAll").value.trim();k.severe=$("#fSev").checked&&!!k.allergies;
  k.patho=$("#fPatho").value.trim();k.obs=$("#fObs").value.trim();k.photos=$("#fPhY").checked;
  k.meds=[...document.querySelectorAll(".med-row")].map(r=>{const [n,d,w]=r.querySelectorAll("input");return {name:n.value.trim(),dose:d.value.trim(),when:w.value.trim()}}).filter(m=>m.name);
  k.done=true;render();scrollTo(0,0);return toast("Fiche enregistrée. Merci !");
 }
 if(e.target.id==="recipeForm"){
  const title=$("#rT").value.trim();if(!title){$("#rErr").hidden=false;return}
  const lines=s=>s.split("\n").map(x=>x.trim()).filter(Boolean);
  recipes.unshift({id:Date.now(),title,time:$("#rTime").value.trim()||"–",level:"Facile",week:+$("#rWeek").value,tags:$("#rTags").value.split(",").map(x=>x.trim()).filter(Boolean),ing:lines($("#rIng").value),steps:lines($("#rSteps").value),hue:"#CDDF70",img:pendingImg});
  S.sheet=null;render();return toast("Recette publiée, les familles la voient déjà");
 }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.sheet){S.sheet=null;render()}});
fillDemo();
render();
</script>

</body>
</html>
